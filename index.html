<!doctype html>
<html lang="en" class="bg-white">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        'use strict';
        const css = `
          netlify-badge, #netlify-badge, #netlify-badge-container, .netlify-badge,
          [data-netlify-badge], iframe#netlify-badge, iframe[title*="Netlify" i] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
          }
        `;

        let badgeHidden = false;
        let scanTimer = null;
        let docObserver = null;
        let bodyObserver = null;

        function injectStyle(root) {
          if (!root || root.querySelector?.('#saryay-netlify-hide-style')) return;
          const style = document.createElement('style');
          style.id = 'saryay-netlify-hide-style';
          style.textContent = css;
          (root.head || root).appendChild(style);
        }

        function hideHostElement(host) {
          if (!host || !host.style || host.id === 'root') return;
          host.style.setProperty('display', 'none', 'important');
          host.style.setProperty('visibility', 'hidden', 'important');
          host.style.setProperty('opacity', '0', 'important');
          host.style.setProperty('pointer-events', 'none', 'important');
        }

        function hideBadgeInTree(root) {
          if (!root || !root.querySelectorAll) return false;
          injectStyle(root);
          let found = false;
          const elements = root.querySelectorAll('*');
          for (const el of elements) {
            if (el.id === 'root') continue;
            if (el.shadowRoot && hideBadgeInTree(el.shadowRoot)) {
              hideHostElement(el);
              found = true;
            }
            const tag = el.tagName;
            if (
              tag === 'NETLIFY-BADGE' ||
              el.id === 'netlify-badge' ||
              el.id === 'netlify-badge-container' ||
              el.hasAttribute?.('data-netlify-badge')
            ) {
              hideHostElement(el);
              found = true;
              continue;
            }
            const text = (el.textContent || '').trim();
            if (/^powered\s+by\s+netlify$/i.test(text)) {
              const rect = el.getBoundingClientRect();
              if (rect.width <= 350 && rect.height <= 120) {
                let target = el;
                while (target.parentElement && target.parentElement !== document.body) {
                  const p = target.parentElement;
                  if (p.id === 'root') break;
                  const r = p.getBoundingClientRect();
                  if (r.width > 350 || r.height > 120) break;
                  target = p;
                  if (getComputedStyle(p).position === 'fixed') break;
                }
                hideHostElement(target);
                found = true;
              }
            }
          }
          return found;
        }

        function scanOutsideRoot() {
          if (!document.documentElement) return;
          injectStyle(document.documentElement);

          const containers = [document.documentElement, document.body].filter(Boolean);
          for (const container of containers) {
            for (const child of container.children) {
              const tag = child.tagName;
              if (
                child.id === 'root' ||
                tag === 'HEAD' ||
                tag === 'BODY' ||
                tag === 'SCRIPT' ||
                tag === 'STYLE' ||
                tag === 'LINK' ||
                tag === 'META'
              ) {
                continue;
              }
              if (child.shadowRoot && hideBadgeInTree(child.shadowRoot)) {
                hideHostElement(child);
                badgeHidden = true;
              }
              if (hideBadgeInTree(child)) {
                badgeHidden = true;
              }
            }
          }

          if (badgeHidden) {
            docObserver?.disconnect();
            bodyObserver?.disconnect();
          }
        }

        function scheduleScan() {
          if (badgeHidden || scanTimer !== null) return;
          scanTimer = window.setTimeout(() => {
            scanTimer = null;
            scanOutsideRoot();
          }, 120);
        }

        const originalAttachShadow = Element.prototype.attachShadow;
        Element.prototype.attachShadow = function (options) {
          const host = this;
          const shadow = originalAttachShadow.call(this, options);
          if (options && options.mode === 'open') {
            if (!host.closest || !host.closest('#root')) {
              let shadowTimer = null;
              const checkShadow = () => {
                if (hideBadgeInTree(shadow)) {
                  hideHostElement(host);
                  badgeHidden = true;
                  shadowObserver.disconnect();
                }
              };
              const shadowObserver = new MutationObserver(() => {
                if (shadowTimer !== null) return;
                shadowTimer = window.setTimeout(() => {
                  shadowTimer = null;
                  checkShadow();
                }, 80);
              });
              checkShadow();
              if (!badgeHidden) {
                shadowObserver.observe(shadow, { childList: true, subtree: true });
              }
            }
          }
          return shadow;
        };

        function attachObservers() {
          if (!document.documentElement) return;
          scanOutsideRoot();
          if (badgeHidden) return;

          // Observe ONLY direct children outside #root so React renders trigger zero scans
          docObserver = new MutationObserver(scheduleScan);
          docObserver.observe(document.documentElement, { childList: true });

          if (document.body) {
            bodyObserver = new MutationObserver(scheduleScan);
            bodyObserver.observe(document.body, { childList: true });
          }
        }

        if (document.readyState === 'loading') {
          if (document.documentElement) {
            injectStyle(document.documentElement);
          }
          document.addEventListener('DOMContentLoaded', attachObservers, { once: true });
        } else {
          attachObservers();
        }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
